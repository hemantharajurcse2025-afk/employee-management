<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            EMS
        </div>

        <div class="nav-title">
            Employee Management System
        </div>

        <div class="nav-links">
            <a href="/">Dashboard</a>
        </div>

    </nav>


    <main class="container">

        <section class="panel">

            <div class="panel-header">

                <div>
                    <h2>Edit Employee</h2>

                    <p>
                        Update employee information
                    </p>
                </div>

            </div>


            <form
                action="{{ url_for('edit_employee', employee_id=employee.employee_id) }}"
                method="POST"
                class="employee-form">


                <!-- Employee ID -->

                <div class="form-group">

                    <label>Employee ID</label>

                    <input
                        type="text"
                        value="{{ employee.employee_id }}"
                        disabled>

                </div>


                <!-- Employee Name -->

                <div class="form-group">

                    <label>Employee Name</label>

                    <input
                        type="text"
                        name="name"
                        value="{{ employee.name }}"
                        required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ employee.email }}"
                        required>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label>Department</label>

                    <select
                        name="department"
                        required>

                        <option value="IT"
                        {% if employee.department == "IT" %}selected{% endif %}>
                            IT
                        </option>

                        <option value="HR"
                        {% if employee.department == "HR" %}selected{% endif %}>
                            HR
                        </option>

                        <option value="Finance"
                        {% if employee.department == "Finance" %}selected{% endif %}>
                            Finance
                        </option>

                        <option value="Marketing"
                        {% if employee.department == "Marketing" %}selected{% endif %}>
                            Marketing
                        </option>

                        <option value="Operations"
                        {% if employee.department == "Operations" %}selected{% endif %}>
                            Operations
                        </option>

                    </select>

                </div>


                <!-- Salary -->

                <div class="form-group">

                    <label>Salary</label>

                    <input
                        type="number"
                        name="salary"
                        value="{{ employee.salary }}"
                        min="0"
                        required>

                </div>


                <div class="form-actions">

                    <a
                        href="/"
                        class="btn-secondary">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn-primary">
                        Update Employee
                    </button>

                </div>

            </form>

        </section>

    </main>


    <footer>

        <p>
            Employee Management System © 2026
        </p>

    </footer>

</body>

</html>
